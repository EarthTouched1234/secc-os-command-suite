name: Legacy Mission Commander — GitHub Pages

# LEGACY DEPLOYMENT ONLY.
# The current Commander Console target is the custom-domain environment.
# This workflow is intentionally manual so pushes to main do not publish the
# current product into the historical GitHub Pages/Mission Commander surface.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: legacy-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NODE_ENV: production
          VITE_DEPLOY_TARGET: legacy-pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
